[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "studip-cli"
version = "0.1.0"
description = "Stud.IP im Terminal: Kurse, Dateien, Termine und Ankündigungen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "smlfg", email = "186922365+smlfg@users.noreply.github.com" },
]
dependencies = [
    "httpx>=0.24",
]

[project.scripts]
studip = "studip_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
